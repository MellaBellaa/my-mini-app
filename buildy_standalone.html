<body>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICONS ---
    const Icon = ({ name, className = "h-5 w-5" }) => {
      const paths = {
        sparkles: <><path d="m12 3 1.2 3.3L16.5 7.5l-3.3 1.2L12 12l-1.2-3.3-3.3-1.2 3.3-1.2Z"/><path d="m18.5 13 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z"/><path d="m5.5 14 .7 1.8 1.8.7-1.8.7L5.5 19l-.7-1.8-1.8-.7 1.8-.7Z"/></>,
        app: <><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7"/></>,
        site: <><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></>,

        bulb: <><path d="M9 18h6M10 21h4"/><path d="M8.2 14.2A6 6 0 1 1 15.8 14c-1 .8-1.3 1.5-1.3 2H9.5c0-.5-.3-1.2-1.3-2Z"/></>,
        folder: <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H9l2 2h7.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5Z"/>,

        desktop: <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
        tablet: <><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></>,
        mobile: <><rect width="12" height="18" x="6" y="3" rx="2"/><line x1="11" x2="13" y1="17" y2="17"/></>,

      return (

    };

    // --- TEMPLATES ---
    const templatesList = [
      { id: "habit-tracker", title: "Habit & Daily Routine Tracker", mode: "app", desc: "Build streaks, daily goals, and progress visualizers.", prompt: "Build a habit and daily routine tracker with streaks and progress statistics" },
      { id: "artisan-bakery", title: "The Artisan Bakery & Café", mode: "site", desc: "Sourdough showcase, story section, and inquiry form.", prompt: "Create a website for an artisan sourdough bakery and specialty coffee shop" },
      { id: "space-dodger", title: "Nebula Space Dodger 2D", mode: "game", desc: "Dodge meteors, gather powerup stars, and beat high scores.", prompt: "Make an arcade game where a spaceship dodges asteroids in space" },
      { id: "flashcard-deck", title: "Flashcard Study Deck", mode: "app", desc: "Interactive cards with flip animation and mastery tallies.", prompt: "Build a flashcard study app to memorize computer science and web development concepts" },
      { id: "saas-landing", title: "Modern AI SaaS Landing Page", mode: "site", desc: "High-converting tech landing page with hero and feature matrix.", prompt: "Create a website for an AI software startup that automates customer workflows" },
      { id: "reflex-blitz", title: "Neon Reflex Speed Blitz", mode: "game", desc: "Test reaction speeds under a 20-second countdown.", prompt: "Make a fun game where you click fast-moving glowing targets before the timer runs out" },
    ];

    // --- RETRO AUDIO SYNTHESIZER (Web Audio API) ---
    class RetroAudioEngine {
      constructor() { this.ctx = null; this.soundOn = true; }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playPickup() {
        if (!this.soundOn) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(1174.66, now + 0.08);
        g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.22);
      }
      playCrash() {
        if (!this.soundOn) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);
        g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.25);
      }
      playGameOver() {
        if (!this.soundOn) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(392, now); osc.frequency.setValueAtTime(196, now + 0.3);
        g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.6);
      }
      playClick() {
        if (!this.soundOn) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(850, now);
        g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.06);
      }
    }
    const audioSynth = new RetroAudioEngine();

    const avatarList = ['🚀', '⚡', '👾', '🦊', '🤖', '👑', '🐱', '🦄', '🔥'];

    // --- MAIN APP ---
    function BuildyApp() {
      const [activeTab, setActiveTab] = useState("studio");
      const [mode, setMode] = useState("app");
      const [prompt, setPrompt] = useState("Build a habit and daily routine tracker with streaks and progress statistics");
      const [generating, setGenerating] = useState(false);
      const [deviceViewport, setDeviceViewport] = useState("desktop");
      const [toast, setToast] = useState(null);

      // Projects
      const [projects, setProjects] = useState(() => {
        try {
          const s = localStorage.getItem("buildly_projects_standalone");
          if (s) return JSON.parse(s);
        } catch(e) {}
        return [
          { id: 1, title: "Daily Habit Tracker", type: "App", prompt: "Habit tracker with streaks", mode: "app" },
          { id: 2, title: "The Artisan Bakery", type: "Website", prompt: "Bakery website", mode: "site" },
          { id: 3, title: "Nebula Space Dodger", type: "Game", prompt: "Space arcade game", mode: "game" },
        ];
      });

      useEffect(() => {
        try { localStorage.setItem("buildly_projects_standalone", JSON.stringify(projects)); } catch(e){}
      }, [projects]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const handleGenerate = (e) => {
        if (e) e.preventDefault();
        setGenerating(true);
        setTimeout(() => {
          setGenerating(false);
          showToast("Creation updated successfully!");
        }, 500);
      };

      // App Habits State
      const [habits, setHabits] = useState([
        { id: 1, name: "Drink 2L Water", streak: 12, done: true },
        { id: 2, name: "Morning Exercise & Yoga", streak: 8, done: true },
        { id: 3, name: "Read 20 pages", streak: 5, done: false },
        { id: 4, name: "Focus Deep Work (2h)", streak: 19, done: false }
      ]);
      const [newHabit, setNewHabit] = useState("");

      // --- GAME STUDIO STATE ---
      const [activeGameType, setActiveGameType] = useState('space');

      // 1. Player Profile
      const [player, setPlayer] = useState(() => {
        try {
          const s = localStorage.getItem("buildly_game_player");
          if (s) return JSON.parse(s);
        } catch(e) {}
        return { name: "Alex J.", icon: "🚀" };
      });
      const [editingPlayer, setEditingPlayer] = useState(false);

      useEffect(() => {
        try { localStorage.setItem("buildly_game_player", JSON.stringify(player)); } catch(e) {}
      }, [player]);

      // 2. Sound Toggle
      const [soundEnabled, setSoundEnabled] = useState(true);
      useEffect(() => {
        audioSynth.soundOn = soundEnabled;
      }, [soundEnabled]);

      // 3. Leaderboard
      const [leaderboard, setLeaderboard] = useState(() => {
        try {
          const s = localStorage.getItem("buildly_game_leaderboard");
          if (s) return JSON.parse(s);
        } catch(e) {}
        return [
          { id: '1', name: 'NovaStrike', icon: '🚀', score: 980, game: 'space', date: 'Today' },
          { id: '2', name: 'CyberViper', icon: '⚡', score: 840, game: 'space', date: 'Yesterday' },
          { id: '3', name: 'PixelQueen', icon: '👑', score: 720, game: 'space', date: '2 days ago' },
          { id: '4', name: 'StarGazer', icon: '🦄', score: 650, game: 'space', date: '3 days ago' },
          { id: '5', name: 'ReflexMaster', icon: '⚡', score: 28, game: 'reflex', date: 'Today' },
        ];
      });
      const [showLeaderboard, setShowLeaderboard] = useState(false);
      const [leaderboardFilter, setLeaderboardFilter] = useState('all');

      useEffect(() => {
        try { localStorage.setItem("buildly_game_leaderboard", JSON.stringify(leaderboard)); } catch(e) {}
      }, [leaderboard]);

      const submitToLeaderboard = (score, game) => {
        const entry = {
          id: Date.now().toString(),
          name: player.name || 'Anonymous',
          icon: player.icon || '🚀',
          score,
          game,
          date: 'Just now'
        };
        setLeaderboard(prev => [entry, ...prev].sort((a,b) => b.score - a.score));
      };

      // 4. Score Card Modal State
      const [showScoreCard, setShowScoreCard] = useState(false);
      const [lastGameStats, setLastGameStats] = useState(null);

      // Replay Action
      const handleReplay = () => {
        setShowScoreCard(false);
        if (activeGameType === 'space') {
          startSpaceGame();
        } else {
          startReflex();
        }
      };

      // Keyboard Shortcut [R] for Replay
      useEffect(() => {
        const handleKey = (e) => {
          if (showScoreCard && (e.key === 'r' || e.key === 'R' || e.key === ' ')) {
            e.preventDefault();
            handleReplay();
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [showScoreCard, activeGameType]);

      // Space Runner State & Canvas
      const canvasRef = useRef(null);
      const [spacePlaying, setSpacePlaying] = useState(false);
      const [spaceScore, setSpaceScore] = useState(0);
      const [spaceLives, setSpaceLives] = useState(3);
      const [spaceStars, setSpaceStars] = useState(0);
      const [spaceStartTime, setSpaceStartTime] = useState(0);

      const startSpaceGame = () => {
        audioSynth.playPickup();
        setSpaceScore(0);
        setSpaceLives(3);
        setSpaceStars(0);
        setSpaceStartTime(Date.now());
        setShowScoreCard(false);
        setSpacePlaying(true);
      };

      useEffect(() => {
        if (mode !== 'game' || activeGameType !== 'space' || !spacePlaying) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        const keys = {};
        const onDown = e => { keys[e.key] = true; };
        const onUp = e => { keys[e.key] = false; };
        window.addEventListener('keydown', onDown);
        window.addEventListener('keyup', onUp);

        const ship = { x: canvas.width / 2, y: canvas.height - 55, speed: 6 };
        let obstacles = [];
        let pickups = [];
        let currentScore = 0;
        let currentLives = 3;
        let starsGathered = 0;
        let frame = 0;

        const bgStars = [];
        for (let i = 0; i < 40; i++) {
          bgStars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: 1 + Math.random() * 2 });
        }

        const loop = () => {
          frame++;
          if ((keys["ArrowLeft"] || keys["a"] || keys["A"]) && ship.x > 24) ship.x -= ship.speed;
          if ((keys["ArrowRight"] || keys["d"] || keys["D"]) && ship.x < canvas.width - 24) ship.x += ship.speed;
          if ((keys["ArrowUp"] || keys["w"] || keys["W"]) && ship.y > 40) ship.y -= ship.speed;
          if ((keys["ArrowDown"] || keys["s"] || keys["S"]) && ship.y < canvas.height - 35) ship.y += ship.speed;

          if (frame % 36 === 0) {
            obstacles.push({
              x: 24 + Math.random() * (canvas.width - 48),
              y: -24,
              r: 12 + Math.random() * 15,
              s: 2.8 + Math.random() * 3.5,
              color: Math.random() > 0.5 ? '#f43f5e' : '#fb923c'
            });
          }
          if (frame % 75 === 0) {
            pickups.push({
              x: 24 + Math.random() * (canvas.width - 48),
              y: -20,
              r: 10,
              s: 2.2
            });
          }

          // Clear
          ctx.fillStyle = '#0a0815';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Stars bg
          ctx.fillStyle = '#ffffff';
          bgStars.forEach(s => {
            s.y += s.s;
            if (s.y > canvas.height) s.y = 0;
            ctx.fillRect(s.x, s.y, 2, 2);
          });

          // Draw Ship & Avatar
          ctx.save();
          ctx.translate(ship.x, ship.y);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-4, 12, 8, 8);
          ctx.fillStyle = '#8b5cf6';
          ctx.beginPath();
          ctx.moveTo(0, -18); ctx.lineTo(16, 12); ctx.lineTo(-16, 12); ctx.closePath();
          ctx.fill();
          ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(player.icon, 0, -2);
          ctx.restore();

          // Obstacles
          for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.y += obs.s;
            ctx.fillStyle = obs.color;
            ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2); ctx.fill();

            const dx = obs.x - ship.x, dy = obs.y - ship.y;
            if (Math.sqrt(dx*dx + dy*dy) < obs.r + 14) {
              obstacles.splice(i, 1);
              currentLives--;
              setSpaceLives(currentLives);
              audioSynth.playCrash();

              if (currentLives <= 0) {
                audioSynth.playGameOver();
                setSpacePlaying(false);
                const dur = Math.round((Date.now() - spaceStartTime) / 1000);
                setLastGameStats({
                  score: currentScore,
                  game: 'space',
                  title: 'Nebula Space Dodger',
                  pickups: starsGathered,
                  durationSec: dur,
                  isHighScore: currentScore > 600
                });
                submitToLeaderboard(currentScore, 'space');
                setShowScoreCard(true);
                return;
              }
            } else if (obs.y > canvas.height + 30) {
              obstacles.splice(i, 1);
              currentScore += 10;
              setSpaceScore(currentScore);
            }
          }

          // Pickups
          for (let i = pickups.length - 1; i >= 0; i--) {
            const item = pickups[i];
            item.y += item.s;
            ctx.fillStyle = '#facc15';
            ctx.beginPath(); ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2); ctx.fill();

            const dx = item.x - ship.x, dy = item.y - ship.y;
            if (Math.sqrt(dx*dx + dy*dy) < item.r + 14) {
              pickups.splice(i, 1);
              starsGathered++;
              currentScore += 50;
              setSpaceScore(currentScore);
              setSpaceStars(starsGathered);
              audioSynth.playPickup();
            } else if (item.y > canvas.height + 30) {
              pickups.splice(i, 1);
            }
          }

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('keydown', onDown);
          window.removeEventListener('keyup', onUp);
        };
      }, [mode, activeGameType, spacePlaying, spaceStartTime, player]);

      // Reflex game state
      const [reflexScore, setReflexScore] = useState(0);
      const [reflexTime, setReflexTime] = useState(20);
      const [reflexPlaying, setReflexPlaying] = useState(false);
      const [targetPos, setTargetPos] = useState({ x: 50, y: 50 });

      useEffect(() => {
        if (!reflexPlaying) return;
        const t = setInterval(() => {
          setReflexTime(time => {
            if (time <= 1) {
              audioSynth.playGameOver();
              setReflexPlaying(false);
              setLastGameStats({
                score: reflexScore,
                game: 'reflex',
                title: 'Reflex Speed Blitz',
                pickups: reflexScore,
                durationSec: 20,
                isHighScore: reflexScore > 20
              });
              submitToLeaderboard(reflexScore, 'reflex');
              setShowScoreCard(true);
              return 0;
            }
            return time - 1;
          });
        }, 1000);
        return () => clearInterval(t);
      }, [reflexPlaying, reflexScore]);

      const hitTarget = () => {
        audioSynth.playPickup();
        setReflexScore(s => s + 1);
        setTargetPos({ x: 15 + Math.random() * 70, y: 15 + Math.random() * 70 });
      };

      const startReflex = () => {
        audioSynth.playPickup();
        setReflexScore(0);
        setReflexTime(20);
        setShowScoreCard(false);
        setReflexPlaying(true);
        setTargetPos({ x: 50, y: 50 });
      };

      // Website State
      const [website, setWebsite] = useState({
        businessName: "The Artisan Boulangerie",
        heroHeadline: "Slow-Fermented Sourdough & Artisanal Pastries",
        tagline: "Old-world French sourdough & morning pastries",
        ctaText: "Explore Morning Menu",
        blurb: "Award-winning neighborhood sourdough bakery and café serving handcrafted croissants and pour-overs made with organic heritage grains.",
        owner: "Élodie Laurent",
        color: "#d97706",
        about: "Trained in Paris, Élodie crafts sourdough bread with organic heritage grains and 48-hour slow fermentation.",
        features: [
          { title: "48h Slow Ferment", desc: "Naturally leavened doughs for crisp blistered crust and superior digestibility." },
          { title: "Organic Heritage Grains", desc: "Locally milled stone-ground flours with zero artificial preservatives." },
          { title: "Dawn-Baked Daily", desc: "Every loaf and croissant pulled fresh from our stone deck ovens at 6:00 AM." }
        ]
      });
      const [showAssembledPopUp, setShowAssembledPopUp] = useState(false);
      const [popUpViewport, setPopUpViewport] = useState("desktop");
      const [activeWebTab, setActiveWebTab] = useState("brand");

      return (
        <div className="min-h-screen flex flex-col bg-[#faf9f8]">
          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-neutral-900 text-white px-5 py-3 rounded-2xl shadow-2xl border border-white/10 text-xs font-bold animate-bounce">
              ✓ {toast}
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-neutral-200/80 bg-white/80 px-6 backdrop-blur-xl">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2.5">
                <span className="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-600 via-indigo-600 to-purple-700 text-white shadow-md">
                  <Icon name="sparkles" className="h-5 w-5" />
                </span>
                <span className="font-display text-xl font-black text-neutral-900">Buildly</span>
                <span className="rounded-full bg-violet-100 px-2 py-0.5 text-[10px] font-bold text-violet-700 uppercase">Studio</span>

                            setActiveTab("studio");
                          }}
                          className="flex-1 py-2 bg-violet-600 text-white font-bold text-xs rounded-xl shadow"
                        >
                          Open in Studio
                        </button>
                        <button
                          onClick={() => {
                            setProjects(projects.filter(item => item.id !== p.id));
                            showToast("Project deleted");
                          }}
                          className="p-2 border border-neutral-200 text-neutral-400 hover:text-rose-500 rounded-xl"
                        >
                          <Icon name="trash" className="h-4 w-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Assembled Site Pop-up Modal */}
          {showAssembledPopUp && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-neutral-950/80 p-2 sm:p-5 backdrop-blur-md">
              <div className="flex h-full max-h-[94vh] w-full max-w-6xl flex-col rounded-3xl border border-white/20 bg-neutral-900 shadow-2xl overflow-hidden text-white">
                {/* Mock Browser Header Bar */}
                <div className="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 bg-neutral-950 px-5 py-3">
                  <div className="flex items-center gap-2">
                    <span className="h-3 w-3 rounded-full bg-rose-500" />
                    <span className="h-3 w-3 rounded-full bg-amber-500" />
                    <span className="h-3 w-3 rounded-full bg-emerald-500" />
                    <span className="ml-3 hidden sm:inline text-xs font-bold text-neutral-400">Assembled Site Pop-up</span>
                  </div>

                  <div className="flex items-center gap-2 bg-white/10 px-4 py-1 rounded-xl text-xs text-neutral-300 font-mono">
                    <span className="text-emerald-400">🔒</span>
                    <span>https://{(website.businessName || 'site').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.buildly.site</span>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="flex items-center gap-1 rounded-xl bg-white/10 p-1">
                      <button onClick={() => setPopUpViewport("desktop")} className={`p-1.5 rounded-lg text-xs ${popUpViewport === 'desktop' ? 'bg-violet-600 text-white' : 'text-neutral-400'}`}>💻 Desktop</button>
                      <button onClick={() => setPopUpViewport("tablet")} className={`p-1.5 rounded-lg text-xs ${popUpViewport === 'tablet' ? 'bg-violet-600 text-white' : 'text-neutral-400'}`}>📟 Tablet</button>
                      <button onClick={() => setPopUpViewport("mobile")} className={`p-1.5 rounded-lg text-xs ${popUpViewport === 'mobile' ? 'bg-violet-600 text-white' : 'text-neutral-400'}`}>📱 Mobile</button>
                    </div>
                    <button onClick={() => setShowAssembledPopUp(false)} className="h-8 w-8 rounded-xl bg-white/10 hover:bg-rose-600 grid place-items-center text-white">×</button>
                  </div>
                </div>

                {/* Viewport Frame */}
                <div className="flex-1 overflow-y-auto bg-neutral-950/50 p-4 sm:p-6 flex justify-center">
                  <div className={`w-full bg-white text-neutral-900 rounded-2xl overflow-hidden shadow-2xl transition-all duration-300 ${popUpViewport === 'mobile' ? 'max-w-sm border-8 border-neutral-800' : popUpViewport === 'tablet' ? 'max-w-2xl border-8 border-neutral-800' : 'max-w-full'}`}>
                    <div className="p-6 sm:p-12 space-y-12">
                      <header className="flex justify-between items-center pb-4 border-b">
                        <span className="font-extrabold text-xl font-display">{website.businessName}</span>
                        <button className="rounded-full text-white px-5 py-2 text-xs font-bold" style={{ backgroundColor: website.color }}>{website.ctaText}</button>
                      </header>
                      <section className="grid sm:grid-cols-2 gap-8 items-center">
                        <div>
                          <span className="text-xs font-bold uppercase px-3 py-1 rounded-full" style={{ backgroundColor: `${website.color}20`, color: website.color }}>{website.tagline}</span>
                          <h2 className="text-4xl font-extrabold font-display text-neutral-900 mt-4 leading-tight">{website.heroHeadline}</h2>
                          <p className="mt-4 text-neutral-600 text-sm sm:text-base leading-relaxed">{website.blurb}</p>
                          <button className="mt-6 rounded-full px-8 py-3.5 text-sm font-bold text-white shadow-lg" style={{ backgroundColor: website.color }}>{website.ctaText}</button>
                        </div>
                        <div className="aspect-[4/3] rounded-3xl p-8 text-white flex flex-col justify-between shadow-2xl" style={{ background: `linear-gradient(135deg, ${website.color}, #181423)` }}>
                          <span className="text-xs uppercase tracking-widest text-white/70">Verified Showcase</span>
                          <h3 className="text-3xl font-extrabold font-display">{website.businessName}</h3>
                          <p className="text-xs text-white/80">Founded by {website.owner} • Est. 2026</p>
                        </div>
                      </section>

                      {/* Features */}
                      <section className="grid sm:grid-cols-3 gap-6 pt-10 border-t border-neutral-100">
                        {website.features.map((f, i) => (
                          <div key={i} className="bg-neutral-50 rounded-3xl p-6 border border-neutral-200">
                            <span className="h-10 w-10 rounded-2xl grid place-items-center text-white font-bold mb-4" style={{ backgroundColor: website.color }}>✓</span>
                            <h4 className="font-bold text-sm text-neutral-900 font-display">{f.title}</h4>
                            <p className="text-xs text-neutral-600 mt-2 leading-relaxed">{f.desc}</p>
                          </div>
                        ))}
                      </section>

                      {/* Founder */}
                      <section className="bg-neutral-900 text-white rounded-3xl p-8 sm:p-10 shadow-xl">
                        <span className="text-xs font-bold uppercase tracking-widest text-violet-400">Meet the Founder</span>
                        <h3 className="text-2xl font-bold font-display mt-1">{website.owner}</h3>
                        <p className="mt-3 text-neutral-300 text-sm leading-relaxed">{website.about}</p>
                      </section>
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between border-t border-white/10 bg-neutral-950 px-6 py-3 text-xs text-neutral-400">
                  <span>Assembled Website Preview • Buildly Studio</span>
                  <button onClick={() => setShowAssembledPopUp(false)} className="text-white hover:underline font-bold">Close Pop-up</button>
                </div>
              </div>
            </div>
          )}

          {/* GAME MODAL 1: PLAYER PROFILE CUSTOMIZER */}
          {editingPlayer && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl border border-violet-500/30 bg-gradient-to-br from-[#1c1432] to-[#0d091a] p-6 text-white shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">{player.icon}</span>
                    <h3 className="font-display font-bold text-base">Customize Player Profile</h3>
                  </div>
                  <button onClick={() => setEditingPlayer(false)} className="text-neutral-400 hover:text-white text-sm">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-neutral-300 mb-1.5">Player Gamer Tag</label>
                  <input
                    type="text"
                    value={player.name}
                    onChange={e => setPlayer({ ...player, name: e.target.value })}
                    maxLength={16}
                    placeholder="Enter gamer tag..."
                    className="w-full rounded-2xl border border-white/20 bg-black/60 px-4 py-2.5 text-xs text-white font-bold outline-none focus:border-violet-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-neutral-300 mb-1.5">Select Player Avatar Icon</label>
                  <div className="flex flex-wrap gap-2">
                    {avatarList.map(icon => (
                      <button
                        key={icon}
                        onClick={() => {
                          audioSynth.playClick();
                          setPlayer({ ...player, icon });
                        }}
                        className={`h-11 w-11 rounded-2xl text-xl flex items-center justify-center transition ${
                          player.icon === icon
                            ? 'bg-violet-600 border-2 border-white scale-110 shadow-lg'
                            : 'bg-white/10 hover:bg-white/20 border border-white/10'
                        }`}
                      >
                        {icon}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    onClick={() => {
                      audioSynth.playClick();
                      setEditingPlayer(false);
                      showToast("Player profile saved!");
                    }}
                    className="w-full rounded-2xl bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 text-xs shadow-lg transition"
                  >
                    Save Profile ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* GAME MODAL 2: LEADERBOARD */}
          {showLeaderboard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-md">
              <div className="w-full max-w-lg rounded-3xl border border-amber-500/30 bg-gradient-to-br from-[#191528] to-[#0a0815] p-6 text-white shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🏆</span>
                    <div>
                      <h3 className="font-display font-bold text-base">Arcade Leaderboard</h3>
                      <p className="text-[11px] text-neutral-400">High scores across all games</p>
                    </div>
                  </div>

                  {/* Filter tabs */}
                  <div className="flex items-center gap-1 bg-white/10 p-1 rounded-xl text-[10px] font-bold">
                    {['all', 'space', 'reflex'].map(f => (
                      <button
                        key={f}
                        onClick={() => {
                          audioSynth.playClick();
                          setLeaderboardFilter(f);
                        }}
                        className={`px-2.5 py-1 rounded-lg uppercase transition ${
                          leaderboardFilter === f ? 'bg-amber-500 text-neutral-950 font-black' : 'text-neutral-400 hover:text-white'
                        }`}
                      >
                        {f}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                  {leaderboard
                    .filter(item => leaderboardFilter === 'all' || item.game === leaderboardFilter)
                    .map((item, idx) => {
                      const badge = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                      const isMe = item.name === player.name;
                      return (
                        <div
                          key={item.id}
                          className={`flex items-center justify-between p-2.5 rounded-2xl border transition ${
                            isMe ? 'bg-violet-900/40 border-violet-500/70 shadow' : 'bg-white/5 border-white/10'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="w-6 text-center font-bold text-xs">{badge}</span>
                            <span className="text-xl">{item.icon}</span>
                            <div>
                              <p className="text-xs font-bold text-white flex items-center gap-1.5">
                                <span>{item.name}</span>
                                {isMe && <span className="rounded bg-violet-500/40 px-1.5 py-0.2 text-[9px] font-extrabold text-violet-200 uppercase">You</span>}
                              </p>
                              <p className="text-[10px] text-neutral-400">
                                {item.game === 'space' ? '🚀 Space Dodger' : '⚡ Reflex Blitz'} • {item.date}
                              </p>
                            </div>
                          </div>
                          <div className="text-right">
                            <span className="font-mono font-black text-sm text-amber-400">{item.score}</span>
                            <span className="text-[10px] text-neutral-400 ml-1">pts</span>
                          </div>
                        </div>
                      );
                    })}
                </div>

                <div className="pt-2 text-right">
                  <button
                    onClick={() => setShowLeaderboard(false)}
                    className="rounded-xl border border-white/15 bg-white/10 hover:bg-white/20 px-4 py-2 text-xs font-bold transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* GAME MODAL 3: OFFICIAL SCORE CARD WITH REPLAY */}
          {showScoreCard && lastGameStats && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl border border-white/20 bg-gradient-to-br from-[#1c162e] to-[#0f0c1a] p-6 sm:p-8 text-white shadow-2xl relative overflow-hidden space-y-6">
                <div className="text-center space-y-2">
                  <div className="inline-flex items-center gap-2 rounded-full bg-violet-500/20 px-3.5 py-1 text-xs font-bold text-violet-300 border border-violet-500/30">
                    <span>{player.icon}</span>
                    <span>{player.name} • Official Score Card</span>
                  </div>

                  <h3 className="font-display text-2xl font-black text-white">{lastGameStats.title}</h3>

                  {lastGameStats.isHighScore && (
                    <span className="inline-block rounded-full bg-amber-400/20 text-amber-300 px-3 py-0.5 text-xs font-extrabold border border-amber-400/40 animate-pulse">
                      🏆 NEW PERSONAL BEST!
                    </span>
                  )}
                </div>

                <div className="rounded-2xl border border-white/10 bg-white/5 p-5 text-center space-y-1">
                  <p className="text-xs font-bold uppercase tracking-wider text-neutral-400">Final Score</p>
                  <p className="font-mono text-5xl font-black text-amber-400">{lastGameStats.score}</p>
                  <p className="text-xs text-violet-300 font-semibold mt-1">
                    Rank Tier: {lastGameStats.score > 500 ? '🌟 Grandmaster' : lastGameStats.score > 250 ? '🚀 Veteran Pilot' : '⚡ Swift Challenger'}
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div className="rounded-xl bg-white/5 p-3 border border-white/10">
                    <span className="text-neutral-400 block text-[10px] uppercase font-bold">Pickups / Hits</span>
                    <span className="font-bold text-white text-base mt-0.5 block">★ {lastGameStats.pickups}</span>
                  </div>
                  <div className="rounded-xl bg-white/5 p-3 border border-white/10">
                    <span className="text-neutral-400 block text-[10px] uppercase font-bold">Time Survived</span>
                    <span className="font-bold text-white text-base mt-0.5 block">⏱️ {lastGameStats.durationSec}s</span>
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    onClick={handleReplay}
                    className="w-full rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-3.5 text-sm shadow-xl shadow-violet-600/40 flex items-center justify-center gap-2 transition hover:scale-102"
                  >
                    <span>Play Again (Replay) ↻</span>
                    <kbd className="rounded bg-white/20 px-1.5 py-0.5 text-[10px] font-mono">[R]</kbd>
                  </button>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => {
                        setShowScoreCard(false);
                        setShowLeaderboard(true);
                      }}
                      className="rounded-xl border border-white/15 bg-white/10 hover:bg-white/20 py-2.5 text-xs font-bold text-neutral-200 transition"
                    >
                      View Leaderboard 🏆
                    </button>
                    <button
                      onClick={() => setShowScoreCard(false)}
                      className="rounded-xl border border-white/15 bg-white/10 hover:bg-white/20 py-2.5 text-xs font-bold text-neutral-200 transition"
                    >
                      Back to Game
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<BuildyApp />, document.getElementById('root'));
  </script>
</body>
</html>
